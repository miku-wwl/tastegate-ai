# EXAMPLE ONLY. A reverse proxy in front of the TasteGate container. Provider-neutral, not deployed, no real host or certificate.
# Replace example.invalid and the certificate paths with values you control. The application sets its own Content-Security-Policy,
# frame, referrer and permissions headers; the proxy adds transport security, request limits and rate limiting.
#
# These limits are PER PROXY INSTANCE. Behind several proxies or replicas they do not add up to a global limit: a shared limiter
# (or a managed edge) is required before any public LIVE access is considered (see docs/PUBLIC_DEPLOYMENT_PREPARATION.md).
limit_req_zone  $binary_remote_addr zone=tastegate_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=tastegate_conn:10m;

upstream tastegate {
  server 127.0.0.1:3000;
  keepalive 8;
}

server {
  listen 80;
  server_name example.invalid;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.invalid;

  ssl_certificate     /etc/ssl/example/fullchain.pem;
  ssl_certificate_key /etc/ssl/example/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;

  client_max_body_size 32k;              # the application's own limit is 16 KiB; this is a second, cheaper fence
  client_body_timeout  10s;
  client_header_timeout 10s;

  # Health is for the platform, not the public.
  location = /api/health {
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://tastegate;
  }

  # The only dynamic endpoint. A plan audit is local and fast; a generous 70 s ceiling matches the application's 60 s budget.
  location /api/audit {
    limit_req  zone=tastegate_api burst=10 nodelay;
    limit_conn tastegate_conn 5;
    limit_except GET POST { deny all; }
    proxy_read_timeout 70s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://tastegate;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://tastegate;
  }
}
