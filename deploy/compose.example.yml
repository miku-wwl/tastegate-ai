# EXAMPLE ONLY. Provider-neutral and not deployed. Nothing here pushes an image, names a registry, or holds a secret.
# Build the image first:   docker build -t tastegate-ai:local .
# Then:                    docker compose -f deploy/compose.example.yml up
#
# The container runs the PRODUCTION-SAFE profile: synthetic and custom plans only, no private recordings, no live access, no credential.
# Do NOT add QLOO_API_KEY, LLM_API_KEY or any NEXT_PUBLIC_* secret: the server refuses to start with them, by design.
services:
  tastegate:
    image: tastegate-ai:local
    read_only: true                      # the image needs no writable root filesystem
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      TASTEGATE_PROFILE: production-safe
      TASTEGATE_DISABLE_LIVE: "1"       # extra operator kill switch on top of the profile
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"            # publish only to loopback; put a TLS-terminating reverse proxy in front (deploy/nginx.example.conf)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M                   # see docs/PUBLIC_DEPLOYMENT_PREPARATION.md for the measured baseline and the margin
          pids: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
